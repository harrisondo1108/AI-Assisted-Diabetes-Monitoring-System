<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu – Hệ thống Tiểu đường</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/configure.css}">
    <style>
        .form-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 30px;
            box-shadow: var(--shadow-sm);
            max-width: 500px;
            margin: 0 auto;
        }
        .form-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--green-800);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group-custom {
            margin-bottom: 20px;
            position: relative;
        }
        .form-group-custom label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .form-group-custom input {
            width: 100%;
            border: 1px solid #ccd8d3;
            border-radius: 10px;
            padding: 12px 40px 12px 14px;
            outline: none;
            font-size: 0.9rem;
            font-family: inherit;
            background: #fff;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }
        .form-group-custom input:focus {
            border-color: var(--green-600);
            box-shadow: 0 0 0 3px rgba(26, 107, 86, 0.1);
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 40px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1rem;
            transition: color 0.2s;
        }
        .toggle-password:hover {
            color: var(--green-700);
        }
        .alert-success {
            margin-bottom: 20px;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            background: var(--mint-200);
            color: var(--green-900);
            font-weight: 600;
            font-size: 0.875rem;
            border-left: 4px solid var(--green-600);
        }
        .error-message {
            color: #ef4444;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }

        /* Password Strength Card Style */
        .strength-card {
            background-color: var(--green-800);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            margin-top: 10px;
            margin-bottom: 10px;
            color: #ffffff;
            border-left: 4px solid var(--mint-400);
            text-align: left;
        }
        .strength-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .strength-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .strength-item {
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.75);
            transition: color 0.2s;
        }
        .strength-item.valid {
            color: #ffffff;
            font-weight: 500;
        }
        .strength-icon {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            transition: color 0.2s;
        }
    </style>
</head>
<body>
<div class="admin-layout">

    <!-- SIDEBAR -->
    <div th:replace="~{layout/admin/sidebar :: sidebar('change-password')}"></div>

    <!-- MAIN -->
    <div class="admin-main">

        <!-- Header -->
        <div th:replace="~{layout/admin/header :: header('Đổi mật khẩu Admin')}"></div>

        <!-- Content -->
        <main class="admin-content">
            
            <div class="form-card">
                <div class="form-title">
                    <i class="fas fa-shield-alt"></i> Thay đổi mật khẩu
                </div>

                <!-- Alert Messages -->
                <div th:if="${errorMessage != null}" class="alert-error" th:text="${errorMessage}">Error</div>
                <div th:if="${successMessage != null}" class="alert-success" th:text="${successMessage}">Success</div>

                <form th:action="@{/admin/change-password}" method="post" id="changePasswordForm">
                    <div class="form-group-custom">
                        <label for="currentPassword">Mật khẩu hiện tại <span class="required">*</span></label>
                        <input type="password" id="currentPassword" name="currentPassword" required placeholder="Nhập mật khẩu hiện tại">
                        <i class="far fa-eye toggle-password" onclick="togglePass('currentPassword')"></i>
                    </div>

                    <div class="form-group-custom">
                        <label for="newPassword">Mật khẩu mới <span class="required">*</span></label>
                        <input type="password" id="newPassword" name="newPassword" required placeholder="Nhập mật khẩu mới">
                        <i class="far fa-eye toggle-password" onclick="togglePass('newPassword')"></i>
                        <span class="error-message" id="newPasswordError">Mật khẩu mới chưa đạt yêu cầu bảo mật mạnh.</span>
                        
                        <!-- Password Strength Requirements Card -->
                        <div class="strength-card">
                            <div class="strength-title">
                                <i class="fa-regular fa-lightbulb" style="color: #f59e0b;"></i> Mật khẩu mạnh
                            </div>
                            <ul class="strength-list">
                                <li class="strength-item" id="reqLength">
                                    <span class="strength-icon"><i class="fa-regular fa-circle"></i></span> Chứa ít nhất 8 ký tự
                                </li>
                                <li class="strength-item" id="reqCases">
                                    <span class="strength-icon"><i class="fa-regular fa-circle"></i></span> Bao gồm chữ hoa và chữ thường
                                </li>
                                <li class="strength-item" id="reqDigit">
                                    <span class="strength-icon"><i class="fa-regular fa-circle"></i></span> Chứa ít nhất một chữ số
                                </li>
                                <li class="strength-item" id="reqSpecial">
                                    <span class="strength-icon"><i class="fa-regular fa-circle"></i></span> Chứa ký tự đặc biệt (!@#$)
                                </li>
                            </ul>
                        </div>
                    </div>

                    <div class="form-group-custom">
                        <label for="confirmPassword">Xác nhận mật khẩu mới <span class="required">*</span></label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Nhập lại mật khẩu mới">
                        <i class="far fa-eye toggle-password" onclick="togglePass('confirmPassword')"></i>
                        <span class="error-message" id="confirmPasswordError">Mật khẩu xác nhận không khớp.</span>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; height: 45px; border-radius: 10px; margin-top: 10px;">
                        <i class="fas fa-key"></i> Cập nhật mật khẩu
                    </button>
                </form>
            </div>
        </main>

        <!-- Footer -->
        <div th:replace="~{layout/admin/footer :: footer}"></div>

    </div>
</div>

<script>
    function togglePass(inputId) {
        const input = document.getElementById(inputId);
        const icon = input.nextElementSibling;
        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }

    const newPasswordInput = document.getElementById("newPassword");
    const reqLength = document.getElementById("reqLength");
    const reqCases = document.getElementById("reqCases");
    const reqDigit = document.getElementById("reqDigit");
    const reqSpecial = document.getElementById("reqSpecial");

    function updateRequirement(element, isValid) {
        const iconSpan = element.querySelector(".strength-icon");
        if (isValid) {
            element.classList.add("valid");
            iconSpan.innerHTML = '<i class="fa-solid fa-circle-check" style="color: var(--mint-400);"></i>';
        } else {
            element.classList.remove("valid");
            iconSpan.innerHTML = '<i class="fa-regular fa-circle" style="color: rgba(255, 255, 255, 0.45);"></i>';
        }
    }

    function checkStrength(val) {
        const isLengthValid = val.length >= 8;
        const hasUpper = /[A-Z]/.test(val);
        const hasLower = /[a-z]/.test(val);
        const hasDigit = /[0-9]/.test(val);
        const hasSpecial = /[\!@#\$%\^&\*\(\)_\+\-\=\[\]\{\};'\:",\.\\\/<>\?~`|]/.test(val);

        updateRequirement(reqLength, isLengthValid);
        updateRequirement(reqCases, hasUpper && hasLower);
        updateRequirement(reqDigit, hasDigit);
        updateRequirement(reqSpecial, hasSpecial);

        return isLengthValid && hasUpper && hasLower && hasDigit && hasSpecial;
    }

    newPasswordInput.addEventListener("input", function() {
        checkStrength(newPasswordInput.value);
    });

    document.getElementById("changePasswordForm").addEventListener("submit", function(event) {
        let valid = true;
        const newPassword = newPasswordInput.value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        
        const newPasswordError = document.getElementById("newPasswordError");
        const confirmPasswordError = document.getElementById("confirmPasswordError");

        newPasswordError.style.display = "none";
        confirmPasswordError.style.display = "none";

        const isStrengthValid = checkStrength(newPassword);

        if (!isStrengthValid) {
            newPasswordError.style.display = "block";
            valid = false;
        }

        if (newPassword !== confirmPassword) {
            confirmPasswordError.style.display = "block";
            valid = false;
        }

        if (!valid) {
            event.preventDefault();
        }
    });
</script>
</body>
</html>
