<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="admin-header patient-header" th:fragment="patientHeader(pageTitle)">
    <div class="header-title-block">
        <span class="header-kicker">Trung tâm hỗ trợ bệnh nhân</span>
        <h1 class="header-page-title" th:text="${pageTitle}">Trang bệnh nhân</h1>
    </div>

    <div class="header-actions">
        <a th:href="@{/patient/notifications}" class="icon-btn header-link-btn" title="Nhắc nhở dùng thuốc">
            <i class="fas fa-bell"></i>
        </a>

        <a th:href="@{/patient/chat}" class="icon-btn header-link-btn" title="Trợ lý chăm sóc AI">
            <i class="fas fa-robot"></i>
        </a>

        <div class="admin-profile patient-header-profile">
            <div class="admin-avatar-icon" aria-hidden="true">
                <i class="fas fa-user"></i>
            </div>

            <div class="profile-text">
                <div class="name" th:text="${patient != null ? patient.fullName : 'Bệnh nhân'}">Bệnh nhân</div>
                <div class="role">Theo dõi tiểu đường</div>
            </div>
        </div>
    </div>
</header>
</body>
</html>
