<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>
    <header class="doctor-header" th:fragment="header(pageTitle, activeMenu)">
        <!-- Brand Info & Location -->
        <div class="header-left">
            <span class="brand-icon"><i class="fas fa-heart-pulse"></i></span>
            <span class="brand-title">DIABETES CARE</span>
            <div class="clinic-tag">
                <span class="pulse-indicator"></span>
                <i class="fas fa-hospital-user"></i>
            </div>
        </div>

        <!-- Navigation links (previously sidebar) -->
        <nav class="header-nav">
            <a th:href="@{/doctor/dashboard}" class="header-nav-item"
                th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''">
                <i class="fas fa-chart-line"></i> Tổng quan
            </a>
            <a th:href="@{/doctor/queue}" class="header-nav-item"
                th:classappend="${activeMenu == 'queue'} ? 'active' : ''">
                <i class="fas fa-list"></i> Hàng đợi
            </a>
            <a th:href="@{/doctor/reminders}" class="header-nav-item"
                th:classappend="${activeMenu == 'reminders'} ? 'active' : ''">
                <i class="fas fa-bell"></i> Nhắc nhở
            </a>
            <a th:href="@{/doctor/requests}" class="header-nav-item" id="navRequestApprovalBtn"
                th:classappend="${activeMenu == 'requests'} ? 'active' : ''"
                style="display: inline-flex; align-items: center;">
                <i class="fas fa-clipboard-check"></i> Duyệt yêu cầu
                <span th:if="${requestedExams != null && !requestedExams.isEmpty()}"
                    style="background-color: var(--doctor-danger); color: white; border-radius: 12px; padding: 2px 7px; font-size: 0.7rem; font-weight: 700; margin-left: 8px; min-width: 20px; text-align: center; box-shadow: 0 2px 5px rgba(197,48,48,0.3);"
                    th:text="${requestedExams.size()}"></span>
            </a>
            <a th:href="@{/doctor/ratings}" class="header-nav-item"
                th:classappend="${activeMenu == 'ratings'} ? 'active' : ''">
                <i class="fas fa-star"></i> Đánh giá
            </a>
        </nav>

        <!-- Right Profile Utilities -->
        <div class="header-right">
            <!-- Active calendar date -->
            <span class="date-display" id="headerDate">
                <i class="far fa-calendar-alt"></i> Đang tải ngày...
            </span>

            <a th:href="@{/doctor/profile}" class="doctor-profile-block" title="Chỉnh sửa hồ sơ"
                style="text-decoration: none; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: opacity 0.2s;"
                onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">
                <div class="doctor-avatar-circle">
                    <img th:if="${session.userProfile != null && session.userProfile.imageUrl != null}"
                        th:src="${session.userProfile.imageUrl}" alt="Avatar"
                        style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;" />
                    <i th:unless="${session.userProfile != null && session.userProfile.imageUrl != null}"
                        class="fas fa-user-md"></i>
                </div>
                <div class="doctor-info-text">
                    <span class="doctor-name-lbl"
                        th:text="${session.userProfile != null ? session.userProfile.fullName : 'BS. Harrison'}">BS.
                        Harrison</span>
                    <span class="doctor-spec-lbl"
                        th:text="${session.userProfile != null ? session.userProfile.specialty : 'Bác sĩ chuyên khoa Nội tiết'}">Bác
                        sĩ chuyên khoa Nội tiết</span>
                </div>
            </a>
            <a th:href="@{/login}" class="logout-link-btn" title="Đăng xuất">
                <i class="fas fa-sign-out-alt"></i>
            </a>
        </div>
        <script th:src="@{/js/doctor/header.js}"></script>
    </header>
</body>

</html>
