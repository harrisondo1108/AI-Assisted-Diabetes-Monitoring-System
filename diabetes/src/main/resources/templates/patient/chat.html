<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI Chat | Diabetes Care System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/patient/patient.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
<div class="admin-layout">
    <div th:replace="~{layout/patient-sidebar :: patientSidebar('chat')}"></div>

    <div class="admin-main">
        <div th:replace="~{layout/patient-header :: patientHeader('AI Chat')}"></div>

        <main class="admin-content">
            <div class="page-header">
                <div>
                    <h1><i class="fas fa-robot"></i> Chat with AI Assistant</h1>
                    <p class="subtitle">Ask general questions about diabetes care and your routine.</p>
                </div>
            </div>

            <div class="chat-layout">
                <div class="patient-card">
                    <div class="card-header">
                        <i class="fas fa-comments" style="color: var(--green-600);"></i>
                        <h3>Conversation</h3>
                    </div>

                    <div class="message-list">
                        <div th:each="message : ${messages}"
                             th:class="'message ' + (${message.sender != null && message.sender.equalsIgnoreCase('PATIENT')} ? 'patient' : 'ai')"
                             th:text="${message.content}">
                            Message content
                        </div>

                        <div class="message ai" th:if="${messages == null || messages.isEmpty()}">
                            Hello, I am your diabetes care assistant. How can I help you today?
                        </div>
                    </div>

                    <div class="chat-input">
                        <input type="text" placeholder="Type your question...">
                        <button type="button">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

                <div class="patient-card">
                    <div class="card-header">
                        <i class="fas fa-clock-rotate-left" style="color: var(--green-600);"></i>
                        <h3>Chat History</h3>
                    </div>

                    <div class="summary-list" th:if="${conversations != null && !conversations.isEmpty()}">
                        <div class="summary-item" th:each="conversation : ${conversations}">
                            <div class="item-label">
                                <i class="fas fa-message"></i>
                                <span th:text="${conversation.topic}">Topic</span>
                            </div>
                            <div class="item-value"
                                 th:text="${conversation.createdAt != null ? #temporals.format(conversation.createdAt, 'dd/MM/yyyy') : ''}">
                                08/06/2026
                            </div>
                        </div>
                    </div>

                    <div class="empty-message" th:if="${conversations == null || conversations.isEmpty()}">
                        No conversation history found.
                    </div>
                </div>
            </div>
        </main>

        <div th:replace="~{layout/footer :: footer}"></div>
    </div>
</div>

<script th:src="@{/js/patient/patient.js}"></script>
</body>
</html>
