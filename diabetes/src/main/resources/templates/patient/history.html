<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medical History | Diabetes Care System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/patient/patient.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
<div class="admin-layout">
    <div th:replace="~{layout/patient-sidebar :: patientSidebar('history')}"></div>

    <div class="admin-main">
        <div th:replace="~{layout/patient-header :: patientHeader('Medical History')}"></div>

        <main class="admin-content">
            <div class="page-header">
                <div>
                    <h1><i class="fas fa-notes-medical"></i> Medical History</h1>
                    <p class="subtitle">View your clinical examination records and follow-up appointments.</p>
                </div>
            </div>

            <div class="patient-card table-wrapper">
                <table class="patient-table">
                    <thead>
                    <tr>
                        <th>Exam Date</th>
                        <th>Medical History</th>
                        <th>Diagnosis Note</th>
                        <th>Next Appointment</th>
                        <th>Status</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="exam : ${examinations}">
                        <td th:text="${exam.examDate != null ? #temporals.format(exam.examDate, 'dd/MM/yyyy HH:mm') : ''}">
                            08/06/2026
                        </td>
                        <td th:text="${exam.medicalHistory}">Diabetes Type 2</td>
                        <td th:text="${exam.diagnosisNote}">Follow treatment plan</td>
                        <td th:text="${exam.nextAppointment != null ? #temporals.format(exam.nextAppointment, 'dd/MM/yyyy HH:mm') : ''}">
                            15/06/2026
                        </td>
                        <td>
                            <span class="badge badge-info" th:text="${exam.status}">Completed</span>
                        </td>
                    </tr>

                    <tr th:if="${examinations == null || examinations.isEmpty()}">
                        <td colspan="5" class="empty-message">No medical history found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <div th:replace="~{layout/footer :: footer}"></div>
    </div>
</div>
</body>
</html>
