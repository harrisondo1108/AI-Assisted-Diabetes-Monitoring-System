<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh giá & Phản hồi | Hệ thống chăm sóc tiểu đường</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS files -->
    <link rel="stylesheet" th:href="@{/css/doctor/doctor-common.css}">
    <style>
        .doctor-content {
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            height: calc(100vh - var(--header-height));
            overflow-y: auto;
        }
        .ratings-layout {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 100%;
            margin: 0;
        }
        .ratings-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            align-items: start;
            width: 100%;
        }
        @media (max-width: 992px) {
            .ratings-grid {
                grid-template-columns: 1fr;
            }
        }
        .ratings-card {
            background: #ffffff;
            border: 1px solid var(--doctor-border, #e2ebe7);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }
        .ratings-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--doctor-primary, #1a6b56);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid rgba(26, 107, 86, 0.1);
            padding-bottom: 12px;
        }
        .score-large {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--doctor-primary, #1a6b56);
            line-height: 1;
        }
        .stars-row {
            color: #eab308;
            font-size: 1.25rem;
            display: flex;
            gap: 4px;
            margin: 10px 0;
        }
        .distribution-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: #4b5563;
        }
        .bar-outer {
            flex: 1;
            height: 8px;
            background: #f3f4f6;
            border-radius: 4px;
            overflow: hidden;
        }
        .bar-inner {
            height: 100%;
            background: #eab308;
            border-radius: 4px;
        }
        .feedback-item {
            border: 1px solid var(--doctor-border, #e2ebe7);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 16px;
            background: #ffffff;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .feedback-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.03);
        }
        .feedback-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .patient-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(26, 107, 86, 0.1);
            color: var(--doctor-primary, #1a6b56);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
        }
        .patient-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .comment-text {
            font-size: 0.95rem;
            color: #374151;
            line-height: 1.5;
            white-space: pre-line;
            background: #f9fafb;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 6px;
        }
        .exam-tag {
            display: inline-block;
            font-size: 0.75rem;
            color: var(--doctor-primary, #1a6b56);
            background: rgba(26, 107, 86, 0.06);
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 6px;
            font-weight: 600;
        }
        .filter-tag {
            transition: all 0.2s;
        }
        .filter-tag:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="doctor-layout">
        <div class="doctor-main">
            <!-- Header -->
            <div th:replace="~{layout/doctor/header :: header('Đánh giá & Phản hồi từ bệnh nhân', 'ratings')}"></div>

            <main class="doctor-content">
                <div class="ratings-layout">
                    
                    <div class="ratings-grid">
                        
                        <!-- Cột trái: Thống kê tổng quan -->
                        <div class="ratings-card">
                            <h2 class="ratings-title">
                                <i class="fas fa-chart-pie"></i> Thống kê tổng quan
                            </h2>
                            <div style="text-align: center; margin-bottom: 24px;">
                                <div class="score-large" th:text="${#numbers.formatDecimal(averageRating, 1, 1)}">0.0</div>
                                <div class="stars-row" style="justify-content: center;">
                                    <th:block th:if="${averageRating >= 1.0}">
                                        <i class="fas fa-star" th:each="star : ${#numbers.sequence(1, T(java.lang.Math).round(averageRating))}"></i>
                                        <i class="far fa-star" th:each="star : ${T(java.lang.Math).round(averageRating) < 5 ? #numbers.sequence(T(java.lang.Math).round(averageRating) + 1, 5) : {}}"></i>
                                    </th:block>
                                    <th:block th:if="${averageRating < 1.0}">
                                        <i class="far fa-star" th:each="star : ${#numbers.sequence(1, 5)}"></i>
                                    </th:block>
                                </div>
                                <div style="font-size: 0.9rem; color: #4b5563; font-weight: 600;" th:text="${'Dựa trên ' + ratingCount + ' đánh giá'}">
                                    Dựa trên 0 đánh giá
                                </div>
                            </div>
                            
                            <!-- Phân bố tỷ lệ sao -->
                            <div style="border-top: 1px solid #f3f4f6; padding-top: 20px;">
                                <div class="distribution-bar">
                                    <span style="width: 45px; font-weight: 600;">5 sao</span>
                                    <div class="bar-outer">
                                        <div class="bar-inner" th:style="'width: ' + ${star5Pct} + '%'"></div>
                                    </div>
                                    <span style="width: 35px; text-align: right;" th:text="${star5Pct + '%'}">0%</span>
                                </div>
                                <div class="distribution-bar">
                                    <span style="width: 45px; font-weight: 600;">4 sao</span>
                                    <div class="bar-outer">
                                        <div class="bar-inner" th:style="'width: ' + ${star4Pct} + '%'"></div>
                                    </div>
                                    <span style="width: 35px; text-align: right;" th:text="${star4Pct + '%'}">0%</span>
                                </div>
                                <div class="distribution-bar">
                                    <span style="width: 45px; font-weight: 600;">3 sao</span>
                                    <div class="bar-outer">
                                        <div class="bar-inner" th:style="'width: ' + ${star3Pct} + '%'"></div>
                                    </div>
                                    <span style="width: 35px; text-align: right;" th:text="${star3Pct + '%'}">0%</span>
                                </div>
                                <div class="distribution-bar">
                                    <span style="width: 45px; font-weight: 600;">2 sao</span>
                                    <div class="bar-outer">
                                        <div class="bar-inner" th:style="'width: ' + ${star2Pct} + '%'"></div>
                                    </div>
                                    <span style="width: 35px; text-align: right;" th:text="${star2Pct + '%'}">0%</span>
                                </div>
                                <div class="distribution-bar">
                                    <span style="width: 45px; font-weight: 600;">1 sao</span>
                                    <div class="bar-outer">
                                        <div class="bar-inner" th:style="'width: ' + ${star1Pct} + '%'"></div>
                                    </div>
                                    <span style="width: 35px; text-align: right;" th:text="${star1Pct + '%'}">0%</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Cột phải: Feed nhận xét chi tiết -->
                        <div class="ratings-card">
                            <h2 class="ratings-title">
                                <i class="fas fa-comments"></i> Phản hồi chi tiết từ người bệnh
                            </h2>
                            
                            <!-- Lọc theo sao -->
                            <div class="rating-filters" style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid #f3f4f6; padding-bottom: 16px;">
                                <a th:href="@{/doctor/ratings(star=null)}"
                                   class="filter-tag"
                                   th:style="${selectedStar == null} ? 'background: var(--doctor-primary, #1a6b56); color: white; border: 1px solid var(--doctor-primary, #1a6b56); border-radius: 20px; padding: 6px 16px; font-size: 0.85rem; font-weight: 600; text-decoration: none; cursor: pointer;' : 'background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; border-radius: 20px; padding: 6px 16px; font-size: 0.85rem; font-weight: 600; text-decoration: none; cursor: pointer;'">
                                    Tất cả
                                </a>
                                <a th:each="val : ${#numbers.sequence(5, 1)}"
                                   th:href="@{/doctor/ratings(star=${val})}"
                                   class="filter-tag"
                                   th:style="${selectedStar == val} ? 'background: var(--doctor-primary, #1a6b56); color: white; border: 1px solid var(--doctor-primary, #1a6b56); border-radius: 20px; padding: 6px 16px; font-size: 0.85rem; font-weight: 600; text-decoration: none; cursor: pointer;' : 'background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; border-radius: 20px; padding: 6px 16px; font-size: 0.85rem; font-weight: 600; text-decoration: none; cursor: pointer;'">
                                    <span th:text="${val}">5</span> <i class="fas fa-star" style="color: #eab308; margin-left: 2px;"></i>
                                </a>
                            </div>

                            <div class="feedback-feed" style="padding-right: 8px;">
                                <div th:each="r : ${ratings}" class="feedback-item">
                                    <div class="feedback-header">
                                        <div class="patient-info">
                                            <div class="patient-avatar" th:text="${r.patient != null ? #strings.substring(r.patient.fullName, 0, 1) : 'B'}">B</div>
                                            <div>
                                                <strong style="color: #111827; font-size: 0.95rem;" th:text="${r.patient != null ? r.patient.fullName : 'Bệnh nhân ẩn danh'}">Họ Tên</strong>
                                                <div class="stars-row" style="font-size: 0.75rem; margin: 4px 0 0 0;">
                                                    <i class="fas fa-star" th:each="star : ${#numbers.sequence(1, r.ratingValue)}"></i>
                                                    <i class="far fa-star" th:each="star : ${r.ratingValue < 5 ? #numbers.sequence(r.ratingValue + 1, 5) : {}}"></i>
                                                </div>
                                            </div>
                                        </div>
                                        <div style="text-align: right;">
                                            <span style="font-size: 0.8rem; color: #6b7280; display: block;" th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}">Ngày giờ</span>
                                            <span class="exam-tag" th:text="${'Mã lượt khám: ' + r.clinicalExamination.clinicalExamId}">EX000001</span>
                                        </div>
                                    </div>
                                    <div class="comment-text" th:text="${r.comment != null and r.comment != '' ? r.comment : 'Không có bình luận chi tiết.'}">Nội dung bình luận</div>
                                </div>
                                
                                <div th:if="${ratings == null or ratings.isEmpty()}" style="text-align: center; padding: 60px 20px; color: #9ca3af;">
                                    <i class="far fa-comments" style="font-size: 3.5rem; color: #d1d5db; margin-bottom: 16px; display: block;"></i>
                                    Chưa có bất kỳ đánh giá hay góp ý nào từ người bệnh.
                                </div>
                            </div>

                            <!-- Phân trang -->
                            <div class="pagination-bar" th:if="${totalPages > 1}" style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; border-top: 1px solid #f3f4f6; padding-top: 20px;">
                                <span class="pagination-info" style="font-size: 0.85rem; color: #6b7280;"
                                      th:with="start=${currentPage * pageSize + 1}, end=${(currentPage + 1) * pageSize > totalItems ? totalItems : (currentPage + 1) * pageSize}"
                                      th:text="${'Hiển thị ' + start + ' - ' + end + ' trong tổng số ' + totalItems + ' đánh giá'}">
                                    Hiển thị 1 - 5 trong tổng số 10 đánh giá
                                </span>
                                <div class="pagination" style="display: flex; align-items: center; gap: 6px;">
                                    <!-- Prev Button -->
                                    <a th:if="${currentPage > 0}"
                                       th:href="@{/doctor/ratings(page=${currentPage - 1}, size=${pageSize}, star=${selectedStar})}"
                                       style="display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--doctor-border, #e2ebe7); background-color: #ffffff; color: #4b5563; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s;">
                                        <i class="fas fa-chevron-left"></i>
                                    </a>
                                    <span th:unless="${currentPage > 0}" style="display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--doctor-border, #e2ebe7); background-color: #ffffff; color: #4b5563; font-size: 0.8rem; font-weight: 600; cursor: not-allowed; text-decoration: none; opacity: 0.4;">
                                        <i class="fas fa-chevron-left"></i>
                                    </span>

                                    <!-- Page Numbers -->
                                    <th:block th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}">
                                        <a th:href="@{/doctor/ratings(page=${pageNum}, size=${pageSize}, star=${selectedStar})}"
                                           th:text="${pageNum + 1}"
                                           th:classappend="${pageNum == currentPage} ? 'active' : ''"
                                           th:style="${pageNum == currentPage} ? 'background-color: var(--doctor-primary, #1a6b56); color: #ffffff; border-color: var(--doctor-primary, #1a6b56); display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--doctor-border, #e2ebe7); font-size: 0.8rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s;' : 'display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--doctor-border, #e2ebe7); background-color: #ffffff; color: #4b5563; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s;'">
                                        </a>
                                    </th:block>

                                    <!-- Next Button -->
                                    <a th:if="${currentPage < totalPages - 1}"
                                       th:href="@{/doctor/ratings(page=${currentPage + 1}, size=${pageSize}, star=${selectedStar})}"
                                       style="display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--doctor-border, #e2ebe7); background-color: #ffffff; color: #4b5563; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s;">
                                        <i class="fas fa-chevron-right"></i>
                                    </a>
                                    <span th:unless="${currentPage < totalPages - 1}" style="display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--doctor-border, #e2ebe7); background-color: #ffffff; color: #4b5563; font-size: 0.8rem; font-weight: 600; cursor: not-allowed; text-decoration: none; opacity: 0.4;">
                                        <i class="fas fa-chevron-right"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                        
                    </div>
                    
                </div>
            </main>
        </div>
    </div>
</body>
</html>
