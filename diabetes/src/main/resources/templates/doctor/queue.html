<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điều khiển bác sĩ | Hệ thống chăm sóc tiểu đường</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Page CSS -->
    <link rel="stylesheet" th:href="@{/css/doctor/doctor-common.css}">
    <link rel="stylesheet" th:href="@{/css/doctor/queue.css}">
</head>

<body>
    <div class="doctor-layout">
        <div class="doctor-main">
            <!-- Header layout replacement -->
            <div th:replace="~{layout/doctor/header :: header('Hàng đợi khám bệnh', 'queue')}"></div>

            <main class="doctor-content">
                <!-- Status/Alert Messages -->
                <div th:if="${successMessage != null}" class="alert-msg success" style="margin: 0 0 20px 0; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 8px; font-size: 0.88rem; font-weight: 500; background: rgba(16, 185, 129, 0.08); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2);">
                    <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage != null}" class="alert-msg error" style="margin: 0 0 20px 0; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 8px; font-size: 0.88rem; font-weight: 500; background: rgba(239, 68, 68, 0.08); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2);">
                    <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
                </div>

                <!-- Statistics cards removed -->

                <div class="dashboard-grid">
                    <!-- Consultation Queue Card -->
                    <div class="card grid-span-3">
                        <div class="card-header">
                            <div class="header-titles">
                                <h2 class="card-title">Hàng đợi khám bệnh</h2>
                                <p class="card-subtitle">Quản lý lịch hẹn khám của bệnh nhân trong ngày hôm nay</p>
                            </div>
                            <form th:action="@{/doctor/queue}" method="get" class="header-actions">
                                <input type="hidden" name="page" value="1">
                                <input type="hidden" name="status" th:value="${currentStatus != null ? currentStatus : 'all'}">
                                
                                <div class="card-search-box">
                                    <i class="fas fa-search"></i>
                                    <input type="text" name="search" id="queueSearchInput" placeholder="Tìm theo tên..."
                                        th:value="${currentSearch}">
                                </div>
                                <div class="filter-pills">
                                    <a th:href="@{/doctor/queue(page=1, status='all', search=${currentSearch})}" class="pill" th:classappend="${currentStatus == 'all' || currentStatus == null} ? 'active' : ''" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Tất cả</a>
                                    <a th:href="@{/doctor/queue(page=1, status='Pending', search=${currentSearch})}" class="pill" th:classappend="${currentStatus == 'Pending'} ? 'active' : ''" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Đang chờ</a>
                                    <a th:href="@{/doctor/queue(page=1, status='InProgress', search=${currentSearch})}" class="pill" th:classappend="${currentStatus == 'InProgress'} ? 'active' : ''" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Đang khám</a>
                                    <a th:href="@{/doctor/queue(page=1, status='Completed', search=${currentSearch})}" class="pill" th:classappend="${currentStatus == 'Completed'} ? 'active' : ''" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Hoàn thành</a>
                                    <a th:href="@{/doctor/queue(page=1, status='Cancelled', search=${currentSearch})}" class="pill" th:classappend="${currentStatus == 'Cancelled'} ? 'active' : ''" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Đã hủy</a>
                                </div>
                            </form>
                        </div>
                        <div class="table-container">
                            <table class="clinical-table">
                                <thead>
                                    <tr>
                                        <th style="display: none;">Mã BN</th>
                                        <th>Họ và tên</th>
                                        <th>Tuổi / Giới tính</th>
                                        <th>Giờ hẹn</th>
                                        <th>Trạng thái</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="queueTableBody">
                                    <tr th:each="p : ${todayQueue}" th:data-status="${p.status}">
                                        <td style="display: none;"><span class="patient-id"
                                                th:text="${p.patient.userId}">Mã BN</span></td>
                                        <td><span class="patient-name" th:text="${p.patient.fullName}">Patient
                                                Name</span></td>
                                        <td
                                            th:text="${(p.patient.dob != null ? (T(java.time.Period).between(p.patient.dob, T(java.time.LocalDate).now()).getYears()) + ' tuổi' : 'N/A') + ' / ' + (p.patient.gender != null ? (p.patient.gender ? 'Nữ' : 'Nam') : 'N/A')}">
                                            Tuổi/Giới tính</td>
                                        <td><span style="font-weight: 500;"
                                                th:text="${#temporals.format(p.examDate, 'hh:mm a')}">08:30 AM</span>
                                        </td>
                                        <td>
                                            <span th:if="${p.status == 'Pending'}" class="badge-status badge-pending"><i
                                                    class="fa-regular fa-clock"></i> Đang chờ</span>
                                            <span th:if="${p.status == 'InProgress'}"
                                                class="badge-status badge-inprogress"><i
                                                    class="fa-solid fa-spinner fa-spin"></i> Đang khám</span>
                                            <span th:if="${p.status == 'Completed'}"
                                                class="badge-status badge-completed"><i
                                                    class="fa-solid fa-circle-check"></i> Hoàn thành</span>
                                            <span th:if="${p.status == 'Cancelled'}" class="badge-status"
                                                style="background: rgba(220, 38, 38, 0.1); color: var(--doctor-danger); border: 1px solid rgba(220, 38, 38, 0.2);"><i
                                                    class="fa-solid fa-ban"></i> Đã hủy</span>
                                        </td>
                                        <td>
                                            <div th:if="${p.status == 'Pending' || p.status == 'InProgress'}" style="display: inline-flex; gap: 6px; align-items: center;">
                                                <a th:href="@{/doctor/examine(patientId=${p.patient.userId})}"
                                                    class="btn btn-primary btn-sm">
                                                    <i class="fas fa-stethoscope"></i> <span
                                                        th:text="${p.status == 'Pending' ? 'Bắt đầu' : 'Khám tiếp'}">Bắt
                                                        đầu</span>
                                                </a>
                                                <button type="button" th:attr="data-patient-id=${p.patient.userId}" class="btn btn-sm open-cancel-modal"
                                                    title="Hủy khám"
                                                    style="background-color:#fee2e2;color:#dc2626;border:1px solid #fecaca;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;">
                                                    <i class="fas fa-times"></i>
                                                </button>
                                                <a th:href="@{/doctor/history(patientId=${p.patient.userId}, from='dashboard')}"
                                                   class="btn btn-secondary btn-sm"
                                                   title="Lịch sử bệnh án"
                                                   style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0;">
                                                    <i class="fas fa-history"></i>
                                                </a>
                                            </div>
                                            <div th:if="${p.status == 'Completed' || p.status == 'Cancelled'}" style="display: inline-flex; gap: 6px; align-items: center;">
                                                <a th:if="${p.status == 'Completed'}"
                                                   th:href="@{/doctor/examine/edit/{id}(id=${p.clinicalExamId})}"
                                                   class="btn btn-primary btn-sm" style="color: white; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
                                                    <i class="fas fa-edit"></i> Sửa
                                                </a>
                                                <a th:href="@{/doctor/history(patientId=${p.patient.userId}, from='dashboard')}"
                                                   class="btn btn-secondary btn-sm"
                                                   title="Lịch sử bệnh án"
                                                   style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0;">
                                                    <i class="fas fa-history"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="card-footer">
                            <div class="pagination" id="queuePagination" th:if="${totalPages > 1}">
                                <!-- Prev Button -->
                                <a th:if="${currentPage > 1}"
                                   th:href="@{/doctor/queue(page=${currentPage - 1}, status=${currentStatus}, search=${currentSearch})}">
                                    <i class="fas fa-chevron-left"></i>
                                </a>
                                <span th:if="${currentPage == 1}" class="disabled">
                                    <i class="fas fa-chevron-left"></i>
                                </span>
                                
                                <!-- Page Numbers -->
                                <a th:each="i : ${#numbers.sequence(1, totalPages)}"
                                   th:text="${i}"
                                   th:href="@{/doctor/queue(page=${i}, status=${currentStatus}, search=${currentSearch})}"
                                   th:classappend="${i == currentPage} ? 'active' : ''">
                                </a>
                                
                                <!-- Next Button -->
                                <a th:if="${currentPage < totalPages}"
                                   th:href="@{/doctor/queue(page=${currentPage + 1}, status=${currentStatus}, search=${currentSearch})}">
                                    <i class="fas fa-chevron-right"></i>
                                </a>
                                <span th:if="${currentPage == totalPages}" class="disabled">
                                    <i class="fas fa-chevron-right"></i>
                                </span>
                            </div>
                        </div>
                    </div>


                </div>
            </main>
        </div>
    </div>
    <!-- CSS Toast Animation for pure CSS notification -->
    <style>
        @keyframes toastAnimation {
            0% { transform: translateY(-50px); opacity: 0; }
            10% { transform: translateY(0); opacity: 1; }
            90% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; pointer-events: none; visibility: hidden; }
        }
        .toast-container .toast {
            animation: toastAnimation 4s forwards;
        }
    </style>
    <!-- Native Toast Container -->
    <div id="toast-container" class="toast-container" th:if="${param.toast}">
        <div class="toast show" th:classappend="${param.toast[0] == 'not_today' ? 'error' : 'success'}">
            <i class="fas" th:classappend="${param.toast[0] == 'not_today' ? 'fa-times-circle' : 'fa-check-circle'}"></i>
            <span th:text="${param.toast[0] == 'completed' ? 'Hoàn thành ca khám thành công!' : (param.toast[0] == 'updated' ? 'Cập nhật ca khám thành công!' : (param.toast[0] == 'cancelled' ? 'Hủy ca khám thành công!' : (param.toast[0] == 'not_today' ? 'Chỉ được phép chỉnh sửa ca khám được thực hiện trong ngày hôm nay.' : 'Thao tác thành công!')))}"></span>
        </div>
    </div>
    
    <!-- Cancel Modal -->
    <div id="cancelModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Xác nhận hủy ca khám</h3>
                <button id="cancelModalClose" class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="patient-brief" style="margin-bottom:12px; color:var(--doctor-text-muted); font-size:0.95rem;"></div>
                <div class="form-group">
                    <label for="modalCancelReason">Lý do hủy <span style="color:#dc2626">*</span></label>
                    <textarea id="modalCancelReason" rows="4" placeholder="Nhập lý do hủy..." style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:6px;"></textarea>
                    <div id="modalCancelError" style="color:#dc2626; margin-top:8px; display:none;"></div>
                </div>
            </div>
            <div class="modal-footer" style="display:flex;justify-content:flex-end;gap:8px;">
                <button id="modalCancelBtn" class="btn btn-cancel">Hủy</button>
                <button id="modalSubmitBtn" class="btn btn-danger">Xác nhận hủy</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/doctor/queue-cancel-modal.js}"></script>
</body>
</html>
