<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ Bệnh nhân | Hệ thống chăm sóc tiểu đường</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Page CSS -->
    <link rel="stylesheet" th:href="@{/css/doctor/doctor-common.css}">
    <link rel="stylesheet" th:href="@{/css/doctor/doctor-patients.css}">
</head>

<body>
    <div class="doctor-layout">
        <div class="doctor-main">
            <!-- Header layout replacement -->
            <div th:replace="~{layout/doctor/header :: header('Hồ sơ bệnh án & Lịch sử bệnh nhân', 'patients')}"></div>

            <main class="doctor-content history-layout">

                <!-- Detailed Medical Timeline (Full-Width) -->
                <section class="patient-history-detail" id="patientDetailSection">
                    <div class="patient-history-container" id="historyDetails">
                        <!-- Top Details Header -->
                        <div class="history-profile-header">
                            <div class="profile-header-meta">
                                <div class="profile-avatar">
                                    <img th:if="${patient.imageUrl != null}" th:src="${patient.imageUrl}" alt="Avatar"
                                        style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;" />
                                    <i th:unless="${patient.imageUrl != null}" class="fas fa-hospital-user"></i>
                                </div>
                                <div>
                                    <h2 class="profile-name" id="detName" th:text="${patient.fullName}">Nguyen Van A
                                    </h2>
                                    <span class="profile-id" id="detId" style="display: none;"
                                        th:text="${patient.userId}">P012932</span>
                                </div>
                            </div>
                            <div class="profile-header-actions">
                                <a id="backBtn"
                                    th:href="${'examine'.equals(from) ? '/doctor/examine' : '/doctor/queue'}"
                                    class="btn btn-secondary btn-sm">
                                    <i class="fas fa-arrow-left"></i> Quay lại
                                </a>
                            </div>
                        </div>



                        <!-- Patient Diagnostics History Timeline -->
                        <div class="history-section-card" style="margin-top: 20px;">
                            <div class="timeline-header-bar"
                                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h3 class="section-title-label" style="margin-bottom: 0;"><i
                                        class="fas fa-timeline"></i> Lịch sử khám bệnh</h3>
                                <form th:action="@{/doctor/history}" method="get" class="timeline-date-filter"
                                    style="display: flex; align-items: center; gap: 10px;">
                                    <input type="hidden" name="patientId" th:value="${patient.userId}">
                                    <input type="hidden" name="from" th:value="${from}">

                                    <div class="date-input-group" style="display: flex; align-items: center; gap: 6px;">
                                        <span
                                            style="font-size: 0.78rem; color: var(--doctor-text-muted); font-weight: 500;">Từ
                                            ngày:</span>
                                        <input type="date" id="timelineFromDate" name="fromDate"
                                            th:value="${currentFromDate}"
                                            style="padding: 4px 8px; border-radius: 6px; border: 1px solid var(--doctor-border); outline: none; font-size: 0.78rem; font-family: inherit; color: var(--doctor-text-main);">
                                    </div>
                                    <div class="date-input-group" style="display: flex; align-items: center; gap: 6px;">
                                        <span
                                            style="font-size: 0.78rem; color: var(--doctor-text-muted); font-weight: 500;">Đến
                                            ngày:</span>
                                        <input type="date" id="timelineToDate" name="toDate" th:value="${currentToDate}"
                                            style="padding: 4px 8px; border-radius: 6px; border: 1px solid var(--doctor-border); outline: none; font-size: 0.78rem; font-family: inherit; color: var(--doctor-text-main);">
                                    </div>

                                    <button type="submit" class="btn btn-secondary btn-sm"
                                        style="padding: 4px 8px; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 4px;">
                                        <i class="fas fa-filter"></i> Lọc
                                    </button>

                                    <a th:href="@{/doctor/history(patientId=${patient.userId}, from=${from})}"
                                        class="btn btn-secondary btn-sm"
                                        style="padding: 4px 8px; font-size: 0.75rem; text-decoration: none; display: inline-flex; align-items: center; color: var(--doctor-text-main);">
                                        Xóa lọc
                                    </a>
                                </form>
                            </div>
                            <div th:if="${dateError != null}"
                                style="color: var(--doctor-danger); font-size: 0.78rem; text-align: right; margin-top: -6px; margin-bottom: 12px; font-weight: 500;">
                                <i class="fas fa-exclamation-circle"></i> <span th:text="${dateError}">Lỗi ngày</span>
                            </div>

                            <div class="timeline-trail" id="consultationTimeline">
                                <div th:each="td, iterStat : ${timelineDetails}" class="timeline-item"
                                    th:classappend="${iterStat.first} ? 'active' : 'N/A'"
                                    th:data-date="${td.exam.examDate != null ? #temporals.format(td.exam.examDate, 'MMMM yyyy') : 'N/A'}"
                                    th:data-exam-date="${td.exam.examDate != null ? #temporals.format(td.exam.examDate, 'yyyy-MM-dd') : ''}">
                                    <div class="timeline-node"></div>
                                    <div class="timeline-content-card"
                                        style="padding: 20px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--doctor-border); border-radius: 8px;">
                                        <div class="timeline-header-meta"
                                            style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--doctor-border); padding-bottom: 10px; margin-bottom: 0;">
                                            <span class="timeline-date"
                                                style="font-weight: 700; color: var(--doctor-primary);"
                                                th:text="${td.exam.examDate != null ? #temporals.format(td.exam.examDate, 'dd/MM/yyyy HH:mm') : 'N/A'}"></span>
                                            <span class="timeline-doc"
                                                style="font-weight: 600; color: var(--doctor-text-main);"
                                                th:text="${'Bác sĩ khám: ' + (td.exam.doctor.profile != null ? td.exam.doctor.profile.fullName : 'N/A')}"></span>
                                            <span class="timeline-status-badge"
                                                th:text="${'Completed'.equalsIgnoreCase(td.exam.status) ? 'Đã hoàn thành' : 'Đã hủy'}"
                                                th:style="${'Completed'.equalsIgnoreCase(td.exam.status) ? 'background-color: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600;' : 'background-color: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600;'}"></span>
                                        </div>

                                        <div class="notes-card clinical"
                                            style="padding: 10px; background-color: var(--doctor-bg-light); border-radius: 6px; border: 1px solid var(--doctor-border);"
                                            th:if="${td.exam.medicalHistory != null && !td.exam.medicalHistory.trim().empty}">
                                            <strong
                                                style="font-size: 0.78rem; color: var(--doctor-text-muted); display: block; margin-bottom: 4px;">Lý
                                                do khám & Bệnh sử:</strong>
                                            <p class="notes-content" style="margin: 0; font-size: 0.85rem;"
                                                th:text="${td.exam.medicalHistory}"></p>
                                        </div>

                                        <!-- Diagnosis or Cancel Reason -->
                                        <div class="notes-card diagnosis"
                                            th:if="${td.exam != null && !'Cancelled'.equalsIgnoreCase(td.exam.status)}"
                                            style="margin-top: 0; background-color: rgba(16, 185, 129, 0.05); border-left: 4px solid var(--doctor-primary); padding: 12px; border-radius: 4px;">
                                            <span class="lbl"
                                                style="font-size: 0.68rem; color: var(--doctor-primary); font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 6px; letter-spacing: 0.5px;"><i
                                                    class="fas fa-file-medical"></i> Chẩn đoán</span>
                                            <h4 class="notes-content"
                                                style="font-weight: 700; color: var(--green-900); margin: 0; font-size: 0.9rem;"
                                                th:text="${td.exam.diagnosisNote != null && !td.exam.diagnosisNote.empty ? td.exam.diagnosisNote : 'N/A'}">
                                            </h4>
                                        </div>
                                        <div class="notes-card diagnosis"
                                            th:if="${td.exam != null && 'Cancelled'.equalsIgnoreCase(td.exam.status)}"
                                            style="margin-top: 0; border-left: 4px solid var(--doctor-danger); background-color: rgba(220, 38, 38, 0.05); padding: 12px; border-radius: 4px;">
                                            <span class="lbl"
                                                style="font-size: 0.68rem; color: var(--doctor-danger); font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 6px; letter-spacing: 0.5px;"><i
                                                    class="fas fa-ban"></i> Lý do hủy</span>
                                            <h4 class="notes-content"
                                                style="font-weight: 700; color: var(--doctor-danger); margin: 0; font-size: 0.9rem;"
                                                th:text="${td.exam.cancelReason != null && !td.exam.cancelReason.empty ? td.exam.cancelReason : 'Không có lý do hủy'}">
                                            </h4>
                                        </div>

                                        <div style="display: flex; justify-content: flex-end; margin-top: 6px;">
                                            <a th:href="@{/doctor/history/detail/{examId}(examId=${td.exam.clinicalExamId}, from=${from})}"
                                                class="btn btn-primary btn-sm"
                                                style="padding: 6px 16px; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; border-radius: 6px; color: #ffffff; background-color: var(--doctor-primary);">
                                                <i class="fas fa-eye"></i> Xem chi tiết
                                            </a>
                                        </div>
                                    </div>
                                </div>
                                <div th:if="${timelineDetails == null || timelineDetails.empty}"
                                     style="color: var(--doctor-text-muted); font-size: 0.85rem; padding: 20px 0; text-align: center;">
                                     Không tìm thấy lịch sử khám bệnh.
                                </div>
                            </div>

                            <!-- Pagination Controls -->
                            <div style="display: flex; justify-content: center; margin-top: 24px; margin-bottom: 12px;" th:if="${totalPages > 1}">
                                <div class="pagination" id="historyPagination">
                                    <!-- Prev Button -->
                                    <a th:if="${currentPage > 1}"
                                       th:href="@{/doctor/history(patientId=${patientId}, from=${from}, fromDate=${currentFromDate}, toDate=${currentToDate}, page=${currentPage - 1})}">
                                        <i class="fas fa-chevron-left"></i>
                                    </a>
                                    <span th:if="${currentPage == 1}" class="disabled">
                                        <i class="fas fa-chevron-left"></i>
                                    </span>
                                    
                                    <!-- Page Numbers -->
                                    <a th:each="i : ${#numbers.sequence(1, totalPages)}"
                                       th:text="${i}"
                                       th:href="@{/doctor/history(patientId=${patientId}, from=${from}, fromDate=${currentFromDate}, toDate=${currentToDate}, page=${i})}"
                                       th:classappend="${i == currentPage} ? 'active' : ''">
                                    </a>
                                    
                                    <!-- Next Button -->
                                    <a th:if="${currentPage < totalPages}"
                                       th:href="@{/doctor/history(patientId=${patientId}, from=${from}, fromDate=${currentFromDate}, toDate=${currentToDate}, page=${currentPage + 1})}">
                                        <i class="fas fa-chevron-right"></i>
                                    </a>
                                    <span th:if="${currentPage == totalPages}" class="disabled">
                                        <i class="fas fa-chevron-right"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                </section>
            </main>
        </div>
    </div>



    <!-- Script assets removed to comply with 0% JS policy -->
</body>

</html>
