<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ bác sĩ | Hệ thống chăm sóc tiểu đường</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS files -->
    <link rel="stylesheet" th:href="@{/css/doctor/doctor-common.css}">
    <link rel="stylesheet" th:href="@{/css/doctor/doctor-profile.css}">
</head>
<body>
    <div class="doctor-layout">
        <div class="doctor-main">
            <!-- Header -->
            <div th:replace="~{doctor/doctor_header :: header('Hồ sơ lâm sàng của tôi', 'profile')}"></div>

            <main class="doctor-content profile-layout">
                <div class="profile-container" style="width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 24px;">
                    <div class="profile-card">
                        <div class="profile-header-banner">
                            <div class="avatar-container">
                                <div class="avatar-large"><i class="fas fa-user-md"></i></div>
                            </div>
                            <div class="header-meta">
                                <h2 th:text="${doctorProfile.fullName}">BS. Harrison</h2>
                                <span class="role-badge"><i class="fas fa-id-card-clip"></i> Bác sĩ điều trị</span>
                            </div>
                        </div>

                        <!-- Flash messages data elements for JS toast -->
                        <div th:if="${successMsg != null}" id="success-message-data" th:data-message="${successMsg}" style="display: none;"></div>
                        <div th:if="${errorMsg != null}" id="error-message-data" th:data-message="${errorMsg}" style="display: none;"></div>

                        <form th:action="@{/doctor/profile/update}" method="POST" class="profile-form">
                            <div class="form-section-title">
                                <i class="fas fa-user-gear"></i> Chi tiết Cá nhân & Chuyên môn
                            </div>
                            
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="fullName">Họ và tên <span class="required">*</span></label>
                                    <div class="input-with-icon">
                                        <i class="fas fa-user"></i>
                                        <input type="text" id="fullName" name="fullName" th:value="${doctorProfile.fullName}" required placeholder="VD: Bác sĩ Nguyễn Văn A">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="phoneNumber">Số điện thoại (Tên tài khoản)</label>
                                    <div class="input-with-icon disabled-field">
                                        <i class="fas fa-phone"></i>
                                        <input type="text" id="phoneNumber" name="phoneNumber" th:value="${doctorProfile.phoneNumber}" disabled>
                                    </div>
                                    <span class="field-hint">Số điện thoại được sử dụng để đăng nhập và chỉ được thay đổi trực tiếp qua quản trị viên.</span>
                                </div>

                                <div class="form-group">
                                    <label for="specialty">Chuyên khoa <span class="required">*</span></label>
                                    <div class="input-with-icon">
                                        <i class="fas fa-stethoscope"></i>
                                        <input type="text" id="specialty" name="specialty" th:value="${doctorProfile.specialty}" required placeholder="VD: Bác sĩ Nội tiết">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="roomId">Phòng khám phân công <span class="required">*</span></label>
                                    <div class="input-with-icon">
                                        <i class="fas fa-door-open"></i>
                                        <select id="roomId" name="roomId" required>
                                            <option th:each="r : ${rooms}" th:value="${r.roomId}" th:text="${r.roomName}" th:selected="${doctorProfile.room != null && doctorProfile.room.roomId == r.roomId}">Phòng 204: Phòng khám Nội tiết</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="dob">Ngày sinh</label>
                                    <div class="input-with-icon">
                                        <i class="fas fa-calendar-day"></i>
                                        <input type="date" id="dob" name="dob" th:value="${doctorProfile.dob}" max="">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label>Giới tính</label>
                                    <div class="gender-radio-group">
                                        <label class="radio-label">
                                            <input type="radio" name="gender" value="false" th:checked="${doctorProfile.gender == null || !doctorProfile.gender}">
                                            <span>Nam</span>
                                        </label>
                                        <label class="radio-label">
                                            <input type="radio" name="gender" value="true" th:checked="${doctorProfile.gender != null && doctorProfile.gender}">
                                            <span>Nữ</span>
                                        </label>
                                    </div>
                                </div>

                                <div class="form-group full-width">
                                    <label for="address">Địa chỉ phòng khám / Văn phòng làm việc</label>
                                    <div class="input-with-icon">
                                        <i class="fas fa-location-dot" style="margin-top: 10px;"></i>
                                        <textarea id="address" name="address" rows="3" placeholder="VD: Khoa Nội tiết, Tầng 3, Tòa nhà B..." th:text="${doctorProfile.address}"></textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="form-actions">
                                <a th:href="@{/doctor/dashboard}" class="btn btn-secondary">
                                    <i class="fas fa-xmark"></i> Hủy
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-check"></i> Lưu thay đổi
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Card Bảo mật tài khoản (Đổi mật khẩu kiểu GitHub) -->
                    <div class="profile-card">
                        <div class="profile-form">
                            <div class="form-section-title">
                                <i class="fas fa-shield-halved"></i> Bảo mật tài khoản
                            </div>
                            
                            <!-- Hàng trạng thái mật khẩu -->
                            <div class="security-row" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--doctor-border);">
                                <div class="security-info" style="display: flex; align-items: center; gap: 15px;">
                                    <div class="security-icon" style="font-size: 1.2rem; color: var(--doctor-text-muted); width: 20px; text-align: center;">
                                        <i class="fas fa-ellipsis-h"></i>
                                    </div>
                                    <div class="security-text">
                                        <div style="font-weight: 700; font-size: 0.9rem; color: var(--doctor-text-main);">Mật khẩu</div>
                                        <div style="font-size: 0.8rem; color: var(--doctor-text-muted);">Đã được cấu hình bảo mật</div>
                                    </div>
                                </div>
                                <button type="button" id="togglePasswordBtn" class="btn btn-secondary btn-sm" style="padding: 6px 16px;">
                                    Đổi mật khẩu
                                </button>
                            </div>

                            <!-- Khung nhập đổi mật khẩu (Ẩn mặc định) -->
                            <form th:action="@{/doctor/profile/change-password}" method="POST" id="passwordForm" style="display: none; padding-top: 20px;">
                                <div class="form-grid" style="grid-template-columns: 1fr; gap: 16px; margin-bottom: 20px;">
                                    <div class="form-group">
                                        <label for="currentPassword">Mật khẩu hiện tại <span class="required">*</span></label>
                                        <div class="input-with-icon">
                                            <i class="fas fa-lock"></i>
                                            <input type="password" id="currentPassword" name="currentPassword" required placeholder="Nhập mật khẩu hiện tại">
                                        </div>
                                        <div class="validation-feedback" id="currentPasswordFeedback"></div>
                                    </div>

                                    <div class="form-group">
                                        <label for="newPassword">Mật khẩu mới <span class="required">*</span></label>
                                        <div class="input-with-icon">
                                            <i class="fas fa-key"></i>
                                            <input type="password" id="newPassword" name="newPassword" required placeholder="Tối thiểu 6 ký tự">
                                        </div>
                                        <div class="validation-feedback" id="newPasswordFeedback"></div>
                                    </div>

                                    <div class="form-group">
                                        <label for="confirmPassword">Xác nhận mật khẩu mới <span class="required">*</span></label>
                                        <div class="input-with-icon">
                                            <i class="fas fa-shield-halved"></i>
                                            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Nhập lại mật khẩu mới">
                                        </div>
                                        <div class="validation-feedback" id="confirmPasswordFeedback"></div>
                                    </div>
                                </div>

                                <div class="form-actions" style="margin-top: 0; padding-top: 15px;">
                                    <button type="submit" id="submitPasswordBtn" class="btn btn-primary" style="padding: 8px 20px;">
                                        Cập nhật mật khẩu
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // Toast Notification System
        function showToast(message, type = 'success') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-circle-xmark' : 'fa-triangle-exclamation');
            toast.innerHTML = `
                <i class="fas ${icon}"></i>
                <span>${message}</span>
                <button type="button" class="toast-close-btn"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(toast);
            
            const closeBtn = toast.querySelector('.toast-close-btn');
            closeBtn.onclick = () => {
                toast.classList.remove('show');
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 300);
            };
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.classList.remove('show');
                    setTimeout(() => { if (toast.parentNode) toast.remove(); }, 300);
                }
            }, 4000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Set max date of birth to today
            const dobInput = document.getElementById('dob');
            if (dobInput) {
                const today = new Date().toISOString().split('T')[0];
                dobInput.max = today;
            }

            // Show flash messages as toasts
            const successEl = document.getElementById('success-message-data');
            const errorEl = document.getElementById('error-message-data');
            if (successEl) {
                showToast(successEl.getAttribute('data-message'), 'success');
            }
            if (errorEl) {
                showToast(errorEl.getAttribute('data-message'), 'error');
            }

            // Password elements
            const currentPassword = document.getElementById('currentPassword');
            const newPassword = document.getElementById('newPassword');
            const confirmPassword = document.getElementById('confirmPassword');
            const submitBtn = document.getElementById('submitPasswordBtn');

            const currentFeedback = document.getElementById('currentPasswordFeedback');
            const newFeedback = document.getElementById('newPasswordFeedback');
            const confirmFeedback = document.getElementById('confirmPasswordFeedback');

            // Toggle Password Form Display (GitHub style)
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const passwordForm = document.getElementById('passwordForm');

            togglePasswordBtn.addEventListener('click', () => {
                if (passwordForm.style.display === 'none') {
                    passwordForm.style.display = 'block';
                    togglePasswordBtn.textContent = 'Ẩn';
                } else {
                    passwordForm.style.display = 'none';
                    togglePasswordBtn.textContent = 'Đổi mật khẩu';
                    
                    // Reset fields & feedback
                    currentPassword.value = '';
                    newPassword.value = '';
                    confirmPassword.value = '';
                    
                    currentFeedback.textContent = '';
                    currentFeedback.className = 'validation-feedback';
                    currentPassword.classList.remove('input-invalid');

                    newFeedback.textContent = '';
                    newFeedback.className = 'validation-feedback';
                    newPassword.classList.remove('input-invalid');

                    confirmFeedback.textContent = '';
                    confirmFeedback.className = 'validation-feedback';
                    confirmPassword.classList.remove('input-invalid');
                    
                    submitBtn.disabled = true;
                }
            });

            // Auto expand password form if there was a redirect error message related to password
            if (errorEl && errorEl.getAttribute('data-message')) {
                const msg = errorEl.getAttribute('data-message').toLowerCase();
                if (msg.includes('password') || msg.includes('mật khẩu')) {
                    passwordForm.style.display = 'block';
                    togglePasswordBtn.textContent = 'Ẩn';
                }
            }

            // Password real-time validation
            function validateForm() {
                let isValid = true;

                // 1. Validate Current Password
                if (!currentPassword.value) {
                    currentFeedback.textContent = "Mật khẩu hiện tại không được để trống.";
                    currentFeedback.className = "validation-feedback invalid";
                    currentPassword.classList.add('input-invalid');
                    isValid = false;
                } else {
                    currentFeedback.textContent = "";
                    currentFeedback.className = "validation-feedback";
                    currentPassword.classList.remove('input-invalid');
                }

                // 2. Validate New Password
                if (!newPassword.value) {
                    newFeedback.textContent = "Mật khẩu mới không được để trống.";
                    newFeedback.className = "validation-feedback invalid";
                    newPassword.classList.add('input-invalid');
                    isValid = false;
                } else if (newPassword.value.length < 6) {
                    newFeedback.textContent = "Mật khẩu mới phải có ít nhất 6 ký tự.";
                    newFeedback.className = "validation-feedback invalid";
                    newPassword.classList.add('input-invalid');
                    isValid = false;
                } else if (newPassword.value === currentPassword.value) {
                    newFeedback.textContent = "Mật khẩu mới không được giống mật khẩu hiện tại.";
                    newFeedback.className = "validation-feedback invalid";
                    newPassword.classList.add('input-invalid');
                    isValid = false;
                } else {
                    newFeedback.textContent = "Mật khẩu hợp lệ.";
                    newFeedback.className = "validation-feedback valid";
                    newPassword.classList.remove('input-invalid');
                }

                // 3. Validate Confirm Password
                if (!confirmPassword.value) {
                    confirmFeedback.textContent = "Vui lòng xác nhận mật khẩu mới.";
                    confirmFeedback.className = "validation-feedback invalid";
                    confirmPassword.classList.add('input-invalid');
                    isValid = false;
                } else if (confirmPassword.value !== newPassword.value) {
                    confirmFeedback.textContent = "Xác nhận mật khẩu không trùng khớp.";
                    confirmFeedback.className = "validation-feedback invalid";
                    confirmPassword.classList.add('input-invalid');
                    isValid = false;
                } else {
                    confirmFeedback.textContent = "Xác nhận mật khẩu khớp.";
                    confirmFeedback.className = "validation-feedback valid";
                    confirmPassword.classList.remove('input-invalid');
                }

                submitBtn.disabled = !isValid;
            }

            // Listeners
            currentPassword.addEventListener('input', validateForm);
            newPassword.addEventListener('input', validateForm);
            confirmPassword.addEventListener('input', validateForm);

            // Initial state: Disable until valid inputs
            submitBtn.disabled = true;
        });
    </script>
</body>
</html>
