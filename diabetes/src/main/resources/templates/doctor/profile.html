<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ bác sĩ | Hệ thống chăm sóc tiểu đường</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS files -->
    <link rel="stylesheet" th:href="@{/css/doctor/doctor-common.css}">
    <link rel="stylesheet" th:href="@{/css/doctor/doctor-profile.css}">
</head>

<body>
    <div class="doctor-layout">
        <div class="doctor-main">
            <!-- Header -->
            <div th:replace="~{layout/doctor/header :: header('Hồ sơ lâm sàng của tôi', 'profile')}"></div>

            <main class="doctor-content profile-layout">
                <div class="profile-container"
                    style="width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 24px;">
                    <div class="profile-card">
                        <div class="profile-header-banner">
                            <div class="avatar-container">
                                <div class="avatar-large">
                                    <img th:if="${doctorProfile.imageUrl != null}" th:src="${doctorProfile.imageUrl}"
                                        alt="Avatar"
                                        style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;" />
                                    <i th:unless="${doctorProfile.imageUrl != null}" class="fas fa-user-md"></i>
                                </div>
                            </div>
                            <div class="header-meta">
                                <h2 th:text="${doctorProfile.fullName}">BS. Harrison</h2>
                                <span class="role-badge"><i class="fas fa-id-card-clip"></i> Bác sĩ điều trị</span>
                            </div>
                        </div>

                        <!-- Static Flash messages (No JS) -->
                        <div th:if="${successMsg != null}" class="alert alert-success"
                            style="padding: 12px 16px; margin-bottom: 20px; border-radius: 8px; background-color: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); display: flex; align-items: center; gap: 8px; font-size: 0.9rem;">
                            <i class="fas fa-circle-check"></i>
                            <span th:text="${successMsg}"></span>
                        </div>
                        <div th:if="${errorMsg != null}" class="alert alert-danger"
                            style="padding: 12px 16px; margin-bottom: 20px; border-radius: 8px; background-color: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); display: flex; align-items: center; gap: 8px; font-size: 0.9rem;">
                            <i class="fas fa-circle-xmark"></i>
                            <span th:text="${errorMsg}"></span>
                        </div>

                        <form th:action="@{/doctor/profile/update}" method="POST" enctype="multipart/form-data"
                            class="profile-form">
                            <div class="form-section-title">
                                <i class="fas fa-user-gear"></i> Chi tiết Cá nhân & Chuyên môn
                            </div>

                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="fullName">Họ và tên <span class="required">*</span></label>
                                    <div class="input-with-icon">
                                        <i class="fas fa-user"></i>
                                        <input type="text" id="fullName" name="fullName"
                                            th:value="${doctorProfile.fullName}" required
                                            placeholder="VD: Bác sĩ Nguyễn Văn A">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="avatarFile">Ảnh đại diện mới</label>
                                    <div class="input-with-icon">
                                        <i class="fas fa-image"></i>
                                        <input type="file" id="avatarFile" name="avatarFile" accept="image/*">
                                    </div>
                                    <span class="field-hint">Chọn file ảnh (.png, .jpg, .jpeg) để cập nhật.</span>
                                </div>

                                <div class="form-group">
                                    <label for="phoneNumber">Số điện thoại (Tên tài khoản)</label>
                                    <div class="input-with-icon disabled-field">
                                        <i class="fas fa-phone"></i>
                                        <input type="text" id="phoneNumber" name="phoneNumber"
                                            th:value="${doctorProfile.phoneNumber}" disabled>
                                    </div>
                                    <span class="field-hint">Số điện thoại được sử dụng để đăng nhập và chỉ được thay
                                        đổi trực tiếp qua quản trị viên.</span>
                                </div>

                                <div class="form-group">
                                    <label for="email">Email</label>
                                    <div class="input-with-icon">
                                        <i class="fas fa-envelope"></i>
                                        <input type="email" id="email" name="email" th:value="${doctorProfile.email}"
                                            placeholder="VD: bacsi@gmail.com">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="specialty">Chuyên khoa <span class="required">*</span></label>
                                    <div class="input-with-icon">
                                        <i class="fas fa-stethoscope"></i>
                                        <input type="text" id="specialty" name="specialty"
                                            th:value="${doctorProfile.specialty}" disabled
                                            placeholder="VD: Bác sĩ Nội tiết">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="roomId">Phòng khám phân công <span class="required">*</span></label>
                                    <div class="input-with-icon">
                                        <i class="fas fa-door-open"></i>
                                        <select id="roomId" name="roomId" disabled>
                                            <option th:each="r : ${rooms}" th:value="${r.roomId}"
                                                th:text="${r.roomName}"
                                                th:selected="${doctorProfile.room != null && doctorProfile.room.roomId == r.roomId}">
                                                Phòng 204: Phòng khám Nội tiết</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="dob">Ngày sinh</label>
                                    <div class="input-with-icon">
                                        <i class="fas fa-calendar-day"></i>
                                        <input type="date" id="dob" name="dob" th:value="${doctorProfile.dob}" max="">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label>Giới tính</label>
                                    <div class="gender-radio-group">
                                        <label class="radio-label">
                                            <input type="radio" name="gender" value="true"
                                                th:checked="${doctorProfile.gender == null || doctorProfile.gender}">
                                            <span>Nam</span>
                                        </label>
                                        <label class="radio-label">
                                            <input type="radio" name="gender" value="false"
                                                th:checked="${doctorProfile.gender != null && !doctorProfile.gender}">
                                            <span>Nữ</span>
                                        </label>
                                    </div>
                                </div>

                                <div class="form-group full-width">
                                    <label for="address">Địa chỉ phòng khám / Văn phòng làm việc</label>
                                    <div class="input-with-icon">
                                        <i class="fas fa-location-dot" style="margin-top: 10px;"></i>
                                        <textarea id="address" name="address" rows="3"
                                            placeholder="VD: Khoa Nội tiết, Tầng 3, Tòa nhà B..."
                                            th:text="${doctorProfile.address}"></textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="form-actions">
                                <a th:href="@{/doctor/dashboard}" class="btn btn-secondary">
                                    <i class="fas fa-xmark"></i> Hủy
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-check"></i> Lưu thay đổi
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Card Bảo mật tài khoản (Đổi mật khẩu kiểu GitHub) -->
                    <!-- Card Bảo mật tài khoản (Đổi mật khẩu kiểu GitHub) -->
                    <div class="profile-card">
                        <div class="profile-form">
                            <div class="form-section-title">
                                <i class="fas fa-shield-halved"></i> Bảo mật tài khoản
                            </div>

                            <!-- Thông báo cho đổi mật khẩu (AJAX container) -->
                            <div id="doctorPwdAlertContainer">
                                <div th:if="${pwdSuccessMsg != null}" class="alert alert-success"
                                    style="padding: 12px 16px; margin-top: 15px; border-radius: 8px; background-color: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); display: flex; align-items: center; gap: 8px; font-size: 0.9rem;">
                                    <i class="fas fa-circle-check"></i>
                                    <span th:text="${pwdSuccessMsg}"></span>
                                </div>
                                <div th:if="${pwdErrorMsg != null}" class="alert alert-danger"
                                    style="padding: 12px 16px; margin-top: 15px; border-radius: 8px; background-color: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); display: flex; align-items: center; gap: 8px; font-size: 0.9rem;">
                                    <i class="fas fa-circle-xmark"></i>
                                    <span th:text="${pwdErrorMsg}"></span>
                                </div>
                            </div>

                            <!-- Hàng trạng thái mật khẩu -->
                            <div class="security-row"
                                style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--doctor-border);">
                                <div class="security-info" style="display: flex; align-items: center; gap: 15px;">
                                    <div class="security-icon"
                                        style="font-size: 1.2rem; color: var(--doctor-text-muted); width: 20px; text-align: center;">
                                        <i class="fas fa-ellipsis-h"></i>
                                    </div>
                                    <div class="security-text">
                                        <div
                                            style="font-weight: 700; font-size: 0.9rem; color: var(--doctor-text-main);">
                                            Mật khẩu</div>
                                        <div style="font-size: 0.8rem; color: var(--doctor-text-muted);">Đã được cấu
                                            hình bảo mật</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Khung nhập đổi mật khẩu (Hiển thị trực tiếp) -->
                            <form th:action="@{/doctor/profile/change-password}" method="POST" id="passwordForm"
                                style="padding-top: 20px;">
                                <div class="form-grid"
                                    style="grid-template-columns: 1fr; gap: 16px; margin-bottom: 20px;">
                                    <div class="form-group">
                                        <label for="currentPassword">Mật khẩu hiện tại <span
                                                class="required">*</span></label>
                                        <div class="input-with-icon" style="position: relative;">
                                            <i class="fas fa-lock"></i>
                                            <input type="password" id="currentPassword" name="currentPassword" required
                                                placeholder="Nhập mật khẩu hiện tại" style="padding-right: 40px;">
                                            <i class="fas fa-eye toggle-password" data-target="currentPassword" style="position: absolute; right: 14px !important; left: auto !important; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--doctor-text-muted, #64748b); z-index: 5; pointer-events: auto !important;"></i>
                                        </div>

                                    </div>

                                    <div class="form-group">
                                        <label for="newPassword">Mật khẩu mới <span class="required">*</span></label>
                                        <div class="input-with-icon" style="position: relative;">
                                            <i class="fas fa-key"></i>
                                            <input type="password" id="newPassword" name="newPassword" required
                                                placeholder="Tối thiểu 8 ký tự, có chữ hoa, thường, số và ký tự đặc biệt (!@#$)" style="padding-right: 40px;">
                                            <i class="fas fa-eye toggle-password" data-target="newPassword" style="position: absolute; right: 14px !important; left: auto !important; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--doctor-text-muted, #64748b); z-index: 5; pointer-events: auto !important;"></i>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="confirmPassword">Xác nhận mật khẩu mới <span
                                                class="required">*</span></label>
                                        <div class="input-with-icon" style="position: relative;">
                                            <i class="fas fa-shield-halved"></i>
                                            <input type="password" id="confirmPassword" name="confirmPassword" required
                                                placeholder="Nhập lại mật khẩu mới" style="padding-right: 40px;">
                                            <i class="fas fa-eye toggle-password" data-target="confirmPassword" style="position: absolute; right: 14px !important; left: auto !important; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--doctor-text-muted, #64748b); z-index: 5; pointer-events: auto !important;"></i>
                                        </div>

                                    </div>
                                </div>

                                <div class="form-actions" style="margin-top: 0; padding-top: 15px;">
                                    <button type="submit" id="submitPasswordBtn" class="btn btn-primary"
                                        style="padding: 8px 20px;">
                                        Cập nhật mật khẩu
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.toggle-password').forEach(function (icon) {
                icon.addEventListener('click', function () {
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    if (input) {
                        if (input.type === 'password') {
                            input.type = 'text';
                            this.classList.remove('fa-eye');
                            this.classList.add('fa-eye-slash');
                        } else {
                            input.type = 'password';
                            this.classList.remove('fa-eye-slash');
                            this.classList.add('fa-eye');
                        }
                    }
                });
            });

            // Handle Password Change via AJAX without page reload
            const pwdForm = document.getElementById('passwordForm');
            if (pwdForm) {
                pwdForm.addEventListener('submit', function (e) {
                    e.preventDefault();
                    const currentPassword = document.getElementById('currentPassword').value;
                    const newPassword = document.getElementById('newPassword').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;

                    const alertContainer = document.getElementById('doctorPwdAlertContainer');
                    if (alertContainer) alertContainer.innerHTML = '';

                    fetch('/doctor/profile/change-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams({
                            'currentPassword': currentPassword,
                            'newPassword': newPassword,
                            'confirmPassword': confirmPassword
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (alertContainer) {
                            if (data.success) {
                                alertContainer.innerHTML = `
                                    <div class="alert alert-success" style="padding: 12px 16px; margin-top: 15px; border-radius: 8px; background-color: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); display: flex; align-items: center; gap: 8px; font-size: 0.9rem;">
                                        <i class="fas fa-circle-check"></i>
                                        <span>${data.message}</span>
                                    </div>
                                `;
                                pwdForm.reset();
                            } else {
                                alertContainer.innerHTML = `
                                    <div class="alert alert-danger" style="padding: 12px 16px; margin-top: 15px; border-radius: 8px; background-color: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); display: flex; align-items: center; gap: 8px; font-size: 0.9rem;">
                                        <i class="fas fa-circle-xmark"></i>
                                        <span>${data.message}</span>
                                    </div>
                                `;
                            }
                        }
                    })
                    .catch(err => {
                        if (alertContainer) {
                            alertContainer.innerHTML = `
                                <div class="alert alert-danger" style="padding: 12px 16px; margin-top: 15px; border-radius: 8px; background-color: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); display: flex; align-items: center; gap: 8px; font-size: 0.9rem;">
                                    <i class="fas fa-circle-xmark"></i>
                                    <span>Đã có lỗi hệ thống xảy ra. Vui lòng thử lại.</span>
                                </div>
                            `;
                        }
                    });
                });
            }
        });
    </script>
</body>

</html>
