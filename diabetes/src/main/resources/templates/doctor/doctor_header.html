<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="doctor-header" th:fragment="header(pageTitle, activeMenu)">
    <!-- Brand Info & Location -->
    <div class="header-left">
        <span class="brand-icon"><i class="fas fa-heart-pulse"></i></span>
        <span class="brand-title">DIABETES CARE</span>
        <div class="clinic-tag">
            <span class="pulse-indicator"></span>
            <i class="fas fa-hospital-user"></i> 
            <span th:text="${session.userProfile != null && session.userProfile.room != null ? 'Rm ' + session.userProfile.room.roomId + ': ' + session.userProfile.room.roomName : 'Rm 204: Endocrinology Clinic'}">Rm 204: Endocrinology Clinic</span>
        </div>
    </div>

    <!-- Navigation links (previously sidebar) -->
    <nav class="header-nav">
        <a th:href="@{/doctor/dashboard}" class="header-nav-item" th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''">
            <i class="fas fa-chart-line"></i> Dashboard
        </a>
    </nav>

    <!-- Right Profile Utilities -->
    <div class="header-right">
        <!-- Active calendar date -->
        <span class="date-display" id="headerDate">
            <i class="far fa-calendar-alt"></i> Loading Date...
        </span>

        <div class="doctor-profile-block">
            <div class="doctor-avatar-circle"><i class="fas fa-user-md"></i></div>
            <div class="doctor-info-text">
                <span class="doctor-name-lbl" th:text="${session.userProfile != null ? session.userProfile.fullName : 'Dr. Harrison'}">Dr. Harrison</span>
                <span class="doctor-spec-lbl" th:text="${session.userProfile != null ? session.userProfile.specialty : 'Endocrinologist'}">Endocrinologist</span>
            </div>
        </div>
        <a th:href="@{/login}" class="logout-link-btn" title="Logout Session">
            <i class="fas fa-sign-out-alt"></i>
        </a>
    </div>
    <script>
        // Set date display in header dynamically
        (function() {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const now = new Date();
            const formattedDate = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
            const dateEl = document.getElementById('headerDate');
            if (dateEl) {
                dateEl.innerHTML = `<i class="far fa-calendar-alt"></i> ${formattedDate}`;
            }
        })();
    </script>
</header>
</body>
</html>
