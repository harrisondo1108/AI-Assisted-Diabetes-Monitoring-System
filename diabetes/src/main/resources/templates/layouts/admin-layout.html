<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- SIDEBAR -->
    <aside th:fragment="sidebar" class="admin-sidebar">
        <div class="sidebar-brand">
            <div class="brand-name">Diabetes Care</div>
            <div class="brand-sub">Admin Console</div>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="#" class="nav-item"><i class="fas fa-chart-line"></i> User Management</a>
            <a href="medicines" class="nav-item active"><i class="fas fa-pills"></i> Medicine Management</a>
            <a href="#" class="nav-item"><i class="fas fa-flask"></i> Lab Tests</a>
            <a href="#" class="nav-item"><i class="fas fa-sliders"></i> Threshold Config</a>
            <a href="#" class="nav-item"><i class="fas fa-desktop"></i> Monitoring</a>
        </nav>
        <div class="sidebar-footer">
            <button type="button" class="btn-new-report"><i class="fas fa-plus"></i> New Report</button>
            <div class="sidebar-footer-links">
                <a href="#"><i class="fas fa-cog"></i> Settings</a>
                <a href="#"><i class="fas fa-life-ring"></i> Support</a>
            </div>
        </div>
    </aside>


<!-- HEADER -->
    <header th:fragment="header" class="admin-header">
        <div class="header-search">
            <i class="fas fa-search"></i>
            <form id="searchForm" th:action="@{/admin/medicines}" method="get">
                <input type="text" name="keyword" id="searchKeyword" placeholder="Search by name, route..." th:value="${searchKeyword}">
                <button type="submit" class="search-btn">Search
                </button>
            </form>
        </div>
        <div class="header-actions">
            <button type="button" class="icon-btn" title="Notifications"><i class="fas fa-bell"></i></button>
            <button type="button" class="icon-btn" title="Help"><i class="fas fa-circle-question"></i></button>
            <div class="admin-profile">
                <div class="admin-avatar-icon"><i class="fas fa-user-shield"></i></div>
                <div class="profile-text">
                    <div class="name">Administrator</div>
                    <div class="role">Chief Administrator</div>
                </div>
            </div>
        </div>
    </header>


<!-- FOOTER -->
    <footer th:fragment="footer" class="admin-footer">
        <span>© 2024 Diabetes Care System</span>
        <span>
                <a href="#">Legal</a>
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Use</a>
            </span>
        <span class="footer-status">
                <span class="dot"></span>
                System Status: Operational
            </span>
    </footer>

</body>
</html>
